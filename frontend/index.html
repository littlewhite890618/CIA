<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <!-- 網址裡有設定連結的 token：不能當成 Referer 送給字型服務或 Instagram -->
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- 粉圓體只用在標題；Google Fonts 依字元切片載入，不會整套下載 -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" />
    <title>晴晴的設定</title>
    <!-- Instagram 私訊的連結預覽卡片。圖片網址必須是完整網址：__PUBLIC_BASE_URL__
         由伺服器送出頁面時換成 PUBLIC_BASE_URL（app/web/settings_api.py）。
         不放 og:url：設定連結帶有 token，不能寫進預覽資料 -->
    <meta property="og:title" content="晴晴的設定" />
    <meta property="og:description" content="調整晴晴的個性，還有聊完之後的回饋方式" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="__PUBLIC_BASE_URL__/assets/og-sunny.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="晴晴" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
